name: Governance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'agent/**'

permissions:
  contents: read

jobs:
  governance:
    name: governance
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run governance fixture tests
        run: ./scripts/Test-Governance.Tests.ps1
      - name: Run CI governance checks
        env:
          GOVERNANCE_EVENT_NAME: ${{ github.event_name }}
          GOVERNANCE_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GOVERNANCE_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GOVERNANCE_GIT_REF: ${{ github.ref }}
        run: |
          $baseRef = ./scripts/Resolve-GovernanceBaseRef.ps1 `
            -EventName $env:GOVERNANCE_EVENT_NAME `
            -PullRequestBaseSha $env:GOVERNANCE_PR_BASE_SHA `
            -PushBeforeSha $env:GOVERNANCE_PUSH_BEFORE_SHA `
            -GitRef $env:GOVERNANCE_GIT_REF
          ./scripts/Test-Governance.ps1 -Mode Ci -BaseRef $baseRef
